name: Bug Report
description: File a bug report to help us improve pdfrev
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please ensure you have tested with the latest release.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: pdfrev Version / Environment
      options:
        - "v0.1.0 (Windows x64 NSIS)"
        - "v0.1.0 (Windows x64 Portable ZIP)"
        - "Headless CLI (pdfrev-cli.exe)"
        - "Source Build (master)"
    validations:
      required: true
