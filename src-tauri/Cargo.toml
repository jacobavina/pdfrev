[package]
name = "pdfrev"
version = "0.1.4"
description = "pdfrev - Fast, local-first PDF viewer and editor"
authors = ["pdfrev contributors"]
license = "MIT"
repository = "https://github.com/jacobavina/pdfrev"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pdfrev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pdfrev"
path = "src/main.rs"

[[bin]]
name = "pdfrev-cli"
path = "src/bin/pdfrev_cli.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
clap = { version = "4.5", features = ["derive"] }
lopdf = "0.38"
flate2 = "1.0"

# OCR nativo de Windows (ADR-0102): la misma versión que ya trae tauri, sin descargar nada nuevo
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_System_Console",
  "Win32_System_WinRT",
] }
